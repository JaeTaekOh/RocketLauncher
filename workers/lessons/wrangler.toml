# Rocket Launcher shared lessons API (Cloudflare Worker).
# Deployed on the project owner's Cloudflare account (Prezentree).
# Public URL is set in js/config.js lessonsApiUrl (and/or ROCKETLAUNCHER_LESSONS_API).
name = "rocket-launcher-lessons"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = true

[[kv_namespaces]]
binding = "LESSONS"
id = "262973ba4e6c4a9e9d8478a630a69870"
